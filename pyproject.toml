[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-manager"
version = "0.1.0"
description = "Agentic research experiment manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "pandas>=2.2.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "sqlalchemy>=2.0.0",
  "pyyaml>=6.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14.0"]


[project.scripts]
research-manager = "research_manager.main:app"

[tool.setuptools.packages.find]
where = ["src"]
